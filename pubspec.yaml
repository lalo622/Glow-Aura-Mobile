name: glow_aura
description: AI-powered skin tracking app
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  go_router: ^13.0.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  camera: ^0.10.5+9
  permission_handler: ^11.3.0
  google_mlkit_face_detection: ^0.11.0
  drift: ^2.4.2
  sqlite3_flutter_libs: ^0.5.24  
  gal: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.2
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  jwt_decoder: ^2.0.1
  intl: ^0.20.2
  image: ^4.2.0
  webview_flutter: ^4.10.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  drift_dev: ^2.4.2              
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/